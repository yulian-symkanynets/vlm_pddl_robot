<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot Task Planner</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #657085; --border: #dde1e8;
    --accent: #2f6fde; --accent-text: #ffffff; --code: #f1f3f6;
    --ok: #1f8a4c; --ok-bg: #e5f5ec; --warn: #a96500; --warn-bg: #fdf1dd;
    --info: #2f6fde; --info-bg: #e6eefc; --bad: #c0352b; --bad-bg: #fbe7e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e5e8ee; --muted: #949db0; --border: #2d333f;
      --accent: #5b8ff0; --accent-text: #0d1117; --code: #232833;
      --ok: #4cc27f; --ok-bg: #173324; --warn: #f0b04f; --warn-bg: #3a2c13;
      --info: #7aa5f5; --info-bg: #1b2a45; --bad: #f07a70; --bad-bg: #3d1d1b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  #server-box { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  #api { width: 200px; max-width: 100%; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
         background: var(--bg); color: var(--text); }
  #server { font-size: 13px; color: var(--muted); }
  #server.down { color: var(--bad); }
  #server b { color: var(--text); font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 18px;
         padding: 18px 20px; max-width: 1300px; margin: 0 auto; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); padding: 16px; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted);
       margin: 0 0 10px; font-weight: 600; }
  label.field { display: block; font-weight: 600; margin: 16px 0 6px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 10px; }
  .tabs button { flex: 1; padding: 7px; border: 1px solid var(--border); background: transparent;
                 color: var(--muted); border-radius: 6px; cursor: pointer; font: inherit; }
  .tabs button.active { background: var(--code); color: var(--text); font-weight: 600; }
  #drop { border: 2px dashed var(--border); border-radius: 8px; padding: 18px; text-align: center;
          color: var(--muted); cursor: pointer; transition: border-color .15s; }
  #drop.over { border-color: var(--accent); color: var(--text); }
  #thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-top: 10px; }
  .thumb { position: relative; aspect-ratio: 4/3; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%;
                  border: none; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; line-height: 1; }
  .small { font-size: 13px; color: var(--muted); }
  textarea { width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 9px;
             background: var(--bg); color: var(--text); font: inherit; resize: vertical; }
  textarea.mono, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 999px;
          padding: 4px 10px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  #run { width: 100%; margin-top: 16px; padding: 11px; border: none; border-radius: 8px;
         background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  #run:disabled { opacity: .6; cursor: wait; }
  .empty { color: var(--muted); text-align: center; padding: 50px 10px; }
  .status { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; margin-bottom: 14px; }
  .status .tag { font-weight: 700; white-space: nowrap; }
  .s-ok { background: var(--ok-bg); color: var(--ok); }
  .s-clarify, .s-need_observation { background: var(--warn-bg); color: var(--warn); }
  .s-no_plan, .s-error { background: var(--bad-bg); color: var(--bad); }
  .status .msg { color: var(--text); }
  ol.plan { list-style: none; padding: 0; margin: 0; counter-reset: step; }
  ol.plan li { counter-increment: step; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px;
               padding: 9px 0; border-top: 1px solid var(--border); }
  ol.plan li:first-child { border-top: none; }
  ol.plan li::before { content: counter(step); width: 26px; height: 26px; border-radius: 50%; background: var(--code);
                       display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  ol.plan .pddl { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin: 14px 0; }
  .stat { background: var(--code); border-radius: 6px; padding: 8px 10px; }
  .stat .v { font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat .k { font-size: 12px; color: var(--muted); }
  details { border-top: 1px solid var(--border); padding: 8px 0; }
  summary { cursor: pointer; font-weight: 600; }
  pre { background: var(--code); padding: 10px; border-radius: 6px; overflow: auto; max-height: 360px;
        white-space: pre-wrap; overflow-wrap: anywhere; margin: 8px 0 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin-top: 6px; }
  td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  .block { margin-top: 14px; }
  .warn { color: var(--warn); font-size: 13px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent;
             border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>Robot Task Planner</h1>
  <div id="server-box">
    <label class="small" for="api">server</label>
    <input id="api" class="mono" spellcheck="false">
    <span id="server">connecting…</span>
  </div>
</header>

<main>
  <section>
    <h2>1 · Scene</h2>
    <div class="tabs">
      <button id="tab-photos" class="active" type="button">Photos</button>
      <button id="tab-json" type="button">Scene JSON (no image)</button>
    </div>
    <div id="pane-photos">
      <div id="drop">Drop photos here or <u>click to choose</u><br><span class="small">several views of the same scene are fine</span></div>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <div id="thumbs"></div>
    </div>
    <div id="pane-json" hidden>
      <textarea id="scene" class="mono" rows="12" placeholder='{"objects": [...], "places": [...], "support": {...}}'></textarea>
      <div class="small">This is what the laptop sends instead of photos (semantic communication).</div>
    </div>

    <label class="field" for="instruction">2 · What should the robot do?</label>
    <textarea id="instruction" rows="3" placeholder="e.g. put the blue cylinder on the yellow block and the green block on the red cylinder"></textarea>

    <label class="field">Examples</label>
    <div id="examples" class="chips"><span class="small">loading…</span></div>

    <button id="run" type="button">Make a plan</button>
  </section>

  <section id="result">
    <h2>Result</h2>
    <div class="empty">Add photos (or a scene JSON), describe the task and press <b>Make a plan</b>.</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let files = [];               // File objects to upload
let mode = 'photos';          // 'photos' | 'json'

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// ---------- which server? same one that served the page; if opened as a file, the field below
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let API = location.protocol.startsWith('http') ? location.origin : (store.get('api') || 'http://127.0.0.1:8010');
$('api').value = API;

function connect() {
  API = $('api').value.trim().replace(/\/+$/, '');
  store.set('api', API);
  $('server').className = '';
  $('server').textContent = 'connecting…';
  fetch(API + '/health').then((r) => r.json()).then((h) => {
    $('server').innerHTML = `model <b>${esc(h.model)}</b>${h.quant && h.quant !== 'none' ? ' · ' + esc(h.quant) : ''}`;
    loadExamples();
  }).catch(() => {
    $('server').className = 'down';
    $('server').textContent = 'not reachable: start ./serve.sh, check the port';
  });
}
$('api').addEventListener('change', connect);

// ---------- tabs
function setMode(m) {
  mode = m;
  $('tab-photos').classList.toggle('active', m === 'photos');
  $('tab-json').classList.toggle('active', m === 'json');
  $('pane-photos').hidden = m !== 'photos';
  $('pane-json').hidden = m !== 'json';
}
$('tab-photos').onclick = () => setMode('photos');
$('tab-json').onclick = () => setMode('json');

// ---------- photos
function renderThumbs() {
  $('thumbs').innerHTML = '';
  files.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'thumb';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.alt = f.name;
    const x = document.createElement('button');
    x.textContent = '×';
    x.title = 'remove';
    x.onclick = () => { files.splice(i, 1); renderThumbs(); };
    d.append(img, x);
    $('thumbs').append(d);
  });
}
function addFiles(list) {
  for (const f of list) if (f.type.startsWith('image/')) files.push(f);
  renderThumbs();
}
$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = (e) => { e.preventDefault(); $('drop').classList.remove('over'); addFiles(e.dataTransfer.files); };

// ---------- examples
function loadExamples() {
fetch(API + '/examples').then((r) => r.json()).then((list) => {
  $('examples').innerHTML = '';
  for (const ex of list) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.type = 'button';
    b.textContent = (ex.images ? '📷 ' : '') + ex.name;
    b.title = ex.instruction;
    b.onclick = async () => {
      $('instruction').value = ex.instruction;
      if (ex.scene) {
        $('scene').value = JSON.stringify(ex.scene, null, 2);
        setMode('json');
      } else {
        files = [];
        for (const url of ex.images) {
          const blob = await (await fetch(API + url)).blob();
          files.push(new File([blob], url.split('/').pop(), {type: blob.type || 'image/jpeg'}));
        }
        renderThumbs();
        setMode('photos');
      }
    };
    $('examples').append(b);
  }
}).catch(() => { $('examples').innerHTML = '<span class="small">no examples</span>'; });
}

// ---------- readable steps
function stepText(action, args, label) {
  const L = (x) => `<b>${esc(label(x))}</b>`;
  const [a, b, c] = args;
  switch (action) {
    case 'pick-from-table': return `Pick up the ${L(a)} from the table`;
    case 'pick-from-item':  return `Lift the ${L(a)} off the ${L(b)}`;
    case 'pick-from-place': return `Take the ${L(a)} out of ${L(c)}`;
    case 'place-on-table':  return `Put the ${L(a)} down on a free spot of the table`;
    case 'place-on-item':   return `Put the ${L(a)} on top of the ${L(b)}`;
    case 'place-in':        return `Put the ${L(a)} into ${L(c)} (slot ${esc(String(b).split('_s').pop())})`;
    case 'open-lid':        return `Open the lid of ${L(a)}`;
    case 'observe':         return `Take another look at the ${L(a)} (new camera view)`;
    default:                return `${esc(action)} ${args.map(esc).join(' ')}`;
  }
}

const STATUS = {
  ok: 'Plan ready', clarify: 'Question', need_observation: 'Need another view',
  no_plan: 'Not possible', error: 'Error',
};
const fmtBytes = (n) => n == null ? '–' : n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(2)} MB`;

function render(res) {
  const labels = {};
  for (const o of res.scene?.objects || []) labels[o.id] = o.label || o.id.replaceAll('_', ' ');
  for (const p of res.scene?.places || []) labels[p.id] = p.id.replaceAll('_', ' ');
  const label = (x) => labels[x] || String(x).replaceAll('_', ' ');

  let h = `<h2>Result</h2>
    <div class="status s-${esc(res.status)}"><span class="tag">${esc(STATUS[res.status] || res.status)}</span>
    <span class="msg">${esc(res.message || (res.status === 'ok' ? `${res.plan.length} steps, checked step by step against the rules` : ''))}</span></div>`;

  if (res.plan?.length) {
    h += '<ol class="plan">' + res.plan.map((s) =>
      `<li><div>${stepText(s.action, s.args, label)}<div class="pddl mono">${esc(s.pddl)}</div></div></li>`).join('') + '</ol>';
  }
  if (res.goal?.length) {
    h += '<div class="block"><b>Goal understood as</b><div class="chips" style="margin-top:6px">' +
      res.goal.map((g) => `<span class="chip">${esc(label(g.object))} ${g.in ? 'in ' + esc(label(g.in)) : 'on ' + esc(label(g.on))}</span>`).join('') + '</div></div>';
  }

  const t = res.timings || {};
  const stats = [
    ['total time', t.total_s != null ? t.total_s + ' s' : '–'],
    ['perception', t.perceive_s != null ? t.perceive_s + ' s' : 'skipped'],
    ['goal model', t.goal_s != null ? t.goal_s + ' s' : '–'],
    ['planner', t.plan_s != null ? t.plan_s + ' s' : '–'],
    ['data sent', fmtBytes(res.received_bytes)],
    ['attempts', res.attempts ? res.attempts.length : 1],
  ];
  h += '<div class="stats">' + stats.map(([k, v]) => `<div class="stat"><div class="v">${esc(v)}</div><div class="k">${k}</div></div>`).join('') + '</div>';

  for (const w of res.warnings || []) h += `<div class="warn">⚠ ${esc(w)}</div>`;

  if (res.scene) {
    const sup = res.scene.support || {};
    h += `<details open><summary>Scene the server used</summary><table><tr><th>object</th><th>rests on</th><th>height</th></tr>` +
      res.scene.objects.map((o) => `<tr><td>${esc(o.label || o.id)} <span class="small mono">${esc(o.id)}</span></td>
        <td>${esc(label(sup[o.id] ?? '?'))}</td><td>${o.height_mm ? esc(o.height_mm) + ' mm' : '–'}</td></tr>`).join('') + '</table>';
    if (res.scene.places?.length) {
      h += '<table><tr><th>place</th><th>kind</th><th>room</th><th>lid</th></tr>' + res.scene.places.map((p) =>
        `<tr><td class="mono">${esc(p.id)}</td><td>${esc(p.kind)}</td><td>${esc(p.capacity)}${p.clearance_mm ? `, ≤ ${esc(p.clearance_mm)} mm` : ''}</td><td>${p.open ? 'open' : 'closed'}</td></tr>`).join('') + '</table>';
    }
    h += '</details>';
  }
  if (res.attempts?.length > 1) {
    h += '<details><summary>Attempts</summary><table><tr><th>#</th><th>status</th><th>message</th></tr>' +
      res.attempts.map((a) => `<tr><td>${a.attempt}</td><td>${esc(a.status)}</td><td>${esc(a.message || '')}</td></tr>`).join('') + '</table></details>';
  }
  if (res.problem_pddl) h += `<details><summary>Generated PDDL problem</summary><pre class="mono">${esc(res.problem_pddl)}</pre></details>`;
  for (const [k, v] of Object.entries(res.model_answers || {})) {
    h += `<details><summary>Model answer: ${esc(k)}</summary><pre class="mono">${esc(v)}</pre></details>`;
  }
  h += `<details><summary>Raw response</summary><pre class="mono">${esc(JSON.stringify(res, null, 2))}</pre></details>`;
  h += `<div class="small" style="margin-top:8px">request id <span class="mono">${esc(res.request_id)}</span> · saved in logs/requests/</div>`;
  $('result').innerHTML = h;
}

// ---------- run
$('run').onclick = async () => {
  const instruction = $('instruction').value.trim();
  if (!instruction) { $('instruction').focus(); return; }
  const fd = new FormData();
  fd.append('instruction', instruction);
  if (mode === 'json') {
    const txt = $('scene').value.trim();
    try { JSON.parse(txt); } catch (e) { alert('Scene JSON is not valid: ' + e.message); return; }
    fd.append('scene', txt);
  } else {
    if (!files.length) { alert('Add at least one photo, or switch to Scene JSON.'); return; }
    for (const f of files) fd.append('files', f, f.name);
  }
  const btn = $('run');
  btn.disabled = true;
  const t0 = Date.now();
  const tick = () => { btn.innerHTML = `<span class="spinner"></span>Thinking… ${((Date.now() - t0) / 1000).toFixed(0)} s`; };
  tick();
  const timer = setInterval(tick, 500);
  try {
    const r = await fetch(API + '/plan/upload', {method: 'POST', body: fd});
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${await r.text()}`);
    render(await r.json());
  } catch (e) {
    $('result').innerHTML = `<h2>Result</h2><div class="status s-error"><span class="tag">Error</span><span class="msg">${esc(e.message)}</span></div>`;
  } finally {
    clearInterval(timer);
    btn.disabled = false;
    btn.textContent = 'Make a plan';
  }
};
connect();
$('instruction').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('run').click(); });
</script>
</body>
</html>
